Lights:
  module: lights
  class: Lights
  max_brightness: 255 # maximum brightness value that lighting can reach for all lights
  min_brightness: # minimum brightness possible for each light type (0 turns off the light)
    bulb: 26 # setting to less than 26 clamps back to 26
    strip: 1
    fan: 0 # setting to 0 turns the light off as expected, but setting to 1 rounds to 0 (light on) - app handles this
  brightness_per_step: # minimimum that brightness has to change before a light actually adjusts
    bulb: 2.55
    strip: 1
    fan: 31.875
  kelvin_per_step: # minimum that kelvin has to change before any light actually adjusts
    bulb: 20 # attribute changes in steps of 1 but a physical change can only be discerned every ≈20 steps
    strip: 38.383838 # attribute changes in steps of 3.8383838 kelvin but a physical change can only be discerned every ≈10 steps
    fan: null # can't change colour temperature except with remote
  max_steps_per_second: 2 # throttle light adjustments per second
  night_to_day_delay: 600 # seconds it has to be light outside before transitioning to day scene
  illuminance:
    bedroom_morning_max: 10 # bedroom illuminance above this triggers transition to day scene
    auto_threshold: # automatic lighting below this threshold, disabled above
      bedroom: 40
      nursery: 20
      kitchen: 75
    auto_off_delay: 5 # minutes illuminance has to exceed threshold before disabling automatic lighting
    lighting_factor: # multiplied by light brightness to estimate powered illuminance
      bedroom: 5
      nursery: 15
      kitchen: 10
  dependencies: Presence
  # log_level: DEBUG
