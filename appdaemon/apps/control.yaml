Control:
  module: control
  class: Control
  init_delay: 60 # seconds after AppDaemon starts for when we assume all apps are initialised
  day_time: "10:00:00" # time for which Morning scene changes to Day if it hasn't already
  settings_change_delay: 2 # seconds delay before handling any settings changes made through the UI
  napping_sustained_delay: 60 # seconds napping mode has to be active for some logic checks to consider true
  heartbeat: # handles system disconnecting from the internet
    url: !secret heartbeat_url
    timeout: 10 # seconds to wait for heartbeat to complete successfully
    max_fail_count: 10 # if heartbeat fails this many times in a row, Home Assistant will restart AFTER it next connects
    period: 60 # seconds between heartbeats
  mobiles: # definitions for device notifiers
    dan:
      name: mobile_app_dans_phone
      type: iOS
    rachel:
      name: mobile_app_rachel_s_phone
      type: Android
  button:
    id: # device IDs provided by Home Assistant with tuya button events
      bf9428682b24aed4a9paaa: dan
      bf3a40d46b789ec295bdtp: rachel
    max_double_press_delay: 2 # if two button presses are made within this timeframe (seconds) then trigger a double press event instead
  ids: # system and user IDs defined by Home Assistant when referencing entity state context
    null: System
    57bea01aa68f44eb94ac2031ecb5b7ba: System
    15ff7a86d4ae4d38a60003ad4064ff78: Dan
    9a175674be354863afb9634adc4b8980: Rachel
  priority: 1
  # log_level: DEBUG
